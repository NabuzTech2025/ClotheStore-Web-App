name: Deploy Food Store Frontend

on:
  push:
    tags:
      - "v*"
      - "setu-v*"
      - "rrfb-v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.setenv.outputs.image_tag }}
      server_ip: ${{ steps.setenv.outputs.server_ip }}
      port: ${{ steps.setenv.outputs.port }}
      tag_name: ${{ steps.extract_tag.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag Name
        id: extract_tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Docker Login
        run: docker login -u jasveer399 -p ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Determine Deployment Environment
        id: setenv
        run: |
          TAG_NAME="${{ steps.extract_tag.outputs.tag }}"

          # Check which domain/environment to deploy based on tag prefix or pattern
          if [[ "$TAG_NAME" == *"rrfootballshirts"* ]] || [[ "$TAG_NAME" == "rrfb-"* ]]; then
            # RR Football Shirts deployment
            echo "image_tag=rrfootballshirts" >> $GITHUB_OUTPUT
            echo "server_ip=138.199.144.4" >> $GITHUB_OUTPUT
            echo "port=3006" >> $GITHUB_OUTPUT
            echo "VITE_APP_NAME=RR Foot ball shirts" >> $GITHUB_ENV
            echo "VITE_STORE_ID=16" >> $GITHUB_ENV
            echo "VITE_APP_BASE_URL=https://rrfootballshirts.com" >> $GITHUB_ENV
            echo "VITE_APP_COPYRIGHT_TEXT=Copyright © RR Football Shirts" >> $GITHUB_ENV
            echo "VITE_COUNTRY=ENGLISH" >> $GITHUB_ENV
            echo "VITE_PAYMENT_LIVE_CLIENT_ID=${{ secrets.PAYPAL_LIVE_CLIENT_ID_RRFOOTBALLSHIRTS }}" >> $GITHUB_ENV
            
          elif [[ "$TAG_NAME" == *"setumarkt"* ]] || [[ "$TAG_NAME" == "setu-"* ]]; then
            # Setumarkt deployment
            echo "image_tag=setumarkt" >> $GITHUB_OUTPUT
            echo "server_ip=138.199.144.4" >> $GITHUB_OUTPUT
            echo "port=3009" >> $GITHUB_OUTPUT
            echo "VITE_APP_NAME=Setumarkt" >> $GITHUB_ENV
            echo "VITE_STORE_ID=16" >> $GITHUB_ENV
            echo "VITE_APP_BASE_URL=https://setumarkt.de" >> $GITHUB_ENV
            echo "VITE_APP_COPYRIGHT_TEXT=Copyright © Setumarkt" >> $GITHUB_ENV
            echo "VITE_COUNTRY=GERMANY" >> $GITHUB_ENV
            echo "VITE_PAYMENT_LIVE_CLIENT_ID=${{ secrets.PAYPAL_LIVE_CLIENT_ID_RRFOOTBALLSHIRTS }}" >> $GITHUB_ENV
            
          else
            echo "❌ Unknown deployment target for tag: $TAG_NAME"
            echo "Use tag patterns like: rrfb-v1.0.0 or setu-v1.0.0"
            exit 1
          fi

          # Common environment variables
          echo "VITE_APP_BASE_ROUTE=" >> $GITHUB_ENV
          echo "VITE_APP_MODE=PRODUCTION" >> $GITHUB_ENV
          echo "VITE_PAYMENT_SANDBOX_CLIENT_ID=AYtWpBvjCBR9vG3hhWICqLmO50cydwWRZ3zzI9momAkgivwMjJ9X3wQICdgCiwv4J7iQVBn_EOKJDVUU" >> $GITHUB_ENV
          echo "VITE_IMAGE_BASE_URL=https://magskr.com" >> $GITHUB_ENV
          echo "VITE_API_BASE_URL=https://magskr.com" >> $GITHUB_ENV
          echo "NODE_ENV=production" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg VITE_IMAGE_BASE_URL="${{ env.VITE_IMAGE_BASE_URL }}" \
            --build-arg VITE_APP_NAME="${{ env.VITE_APP_NAME }}" \
            --build-arg VITE_STORE_ID="${{ env.VITE_STORE_ID }}" \
            --build-arg VITE_API_BASE_URL="${{ env.VITE_API_BASE_URL }}" \
            --build-arg VITE_APP_BASE_URL="${{ env.VITE_APP_BASE_URL }}" \
            --build-arg VITE_APP_BASE_ROUTE="${{ env.VITE_APP_BASE_ROUTE }}" \
            --build-arg NODE_ENV="${{ env.NODE_ENV }}" \
            --build-arg VITE_APP_COPYRIGHT_TEXT="${{ env.VITE_APP_COPYRIGHT_TEXT }}" \
            --build-arg VITE_COUNTRY="${{ env.VITE_COUNTRY }}" \
            --build-arg VITE_PAYMENT_LIVE_CLIENT_ID="${{ env.VITE_PAYMENT_LIVE_CLIENT_ID }}" \
            --build-arg VITE_PAYMENT_SANDBOX_CLIENT_ID="${{ env.VITE_PAYMENT_SANDBOX_CLIENT_ID }}" \
            --build-arg VITE_APP_MODE="${{ env.VITE_APP_MODE }}" \
            -t jasveer399/food-store-web:${{ steps.setenv.outputs.image_tag }}-${{ steps.extract_tag.outputs.tag }} \
            -t jasveer399/food-store-web:${{ steps.setenv.outputs.image_tag }}-latest .

      - name: Push Docker Images
        run: |
          docker push jasveer399/food-store-web:${{ steps.setenv.outputs.image_tag }}-${{ steps.extract_tag.outputs.tag }}
          docker push jasveer399/food-store-web:${{ steps.setenv.outputs.image_tag }}-latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key
        run: |
          echo "${{ secrets.LIVE_SERVER_SSH_KEY }}" > server.pem
          chmod 600 server.pem

      - name: Deploy to Production Server
        run: |
          ssh -o StrictHostKeyChecking=no -i server.pem root@${{ needs.build-and-push.outputs.server_ip }} << 'EOF'
            IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            TAG_NAME=${{ needs.build-and-push.outputs.tag_name }}
            CONTAINER_NAME=food-store-$IMAGE_TAG
            PORT=${{ needs.build-and-push.outputs.port }}

            echo "=========================================="
            echo "Deploying $IMAGE_TAG"
            echo "Tag: $TAG_NAME"
            echo "Container: $CONTAINER_NAME"
            echo "Port: $PORT"
            echo "=========================================="

            # Pull the latest image
            echo "📥 Pulling Docker image..."
            docker pull jasveer399/food-store-web:$IMAGE_TAG-latest

            # Stop and remove existing container if it exists
            if docker ps -a --format 'table {{.Names}}' | grep -q "^$CONTAINER_NAME$"; then
              echo "🛑 Stopping existing container: $CONTAINER_NAME"
              docker stop $CONTAINER_NAME
              docker rm $CONTAINER_NAME
            fi

            # Run new container
            echo "🚀 Starting new container: $CONTAINER_NAME on port $PORT"
            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p $PORT:80 \
              jasveer399/food-store-web:$IMAGE_TAG-latest

            # Wait a moment for container to start
            sleep 3

            # Verify container is running
            if docker ps | grep -q $CONTAINER_NAME; then
              echo "✅ Container $CONTAINER_NAME is running successfully"
              docker ps | grep $CONTAINER_NAME
            else
              echo "❌ Failed to start container $CONTAINER_NAME"
              echo "📋 Container logs:"
              docker logs $CONTAINER_NAME
              exit 1
            fi

            # Clean up unused images and containers
            echo "🧹 Cleaning up unused Docker resources..."
            docker system prune -f

            echo "=========================================="
            echo "✅ Deployment completed successfully!"
            echo "Tag: $TAG_NAME"
            echo "Container: $CONTAINER_NAME"
            echo "Status: Running on port $PORT"
            echo "=========================================="
          EOF

      - name: Deployment Summary
        run: |
          echo "### 🚀 Deployment Successful! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.build-and-push.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ needs.build-and-push.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Server IP:** ${{ needs.build-and-push.outputs.server_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "**Port:** ${{ needs.build-and-push.outputs.port }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Container is running successfully" >> $GITHUB_STEP_SUMMARY
